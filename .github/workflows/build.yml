name: Build Landing Page

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/template.html"
      - "build.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Deploy index.html to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy the built file before switching branches
          cp website/index.html /tmp/index.html

          # Switch to deploy branch (create orphan if it doesn't exist yet)
          if git ls-remote --exit-code origin deploy; then
            git fetch origin deploy
            git checkout deploy
          else
            git checkout --orphan deploy
            git rm -rf . --quiet
          fi

          # Place index.html at repo root
          cp /tmp/index.html index.html

          # Commit and push
          git add index.html
          git diff --staged --quiet || git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin deploy
