section_label: "Cerita nyata"
heading: "DIBANGUN\nDENGAN BASE"
sub: "Dari freelancer solo hingga brand yang berkembang — bisnis di seluruh Indonesia menggunakan Base untuk membangun kehadiran digital mereka."
items:
  - quote: "Sebelumnya saya pakai 4 app berbeda. Sekarang cukup Base. Website, link bio, sampai invoice klien — semua di satu tempat yang rapi."
    name: Rizky Pratama
    role: "Freelance Designer — Bandung"
    initial: R

  - quote: "Buka toko online dalam satu sore. Analitik menunjukkan produk mana yang paling banyak dilihat. Penjualan naik 40% dalam dua bulan."
    name: Sarah Widiastuti
    role: "F&B Owner — Jakarta"
    initial: S

  - quote: "Kalau ada platform ini dari dulu, bisnis saya udah jauh lebih besar. Base itu simple tapi powerful — exactly what a small business needs."
    name: Andi Kurniawan
    role: "UMKM Owner — Surabaya"
    initial: A
